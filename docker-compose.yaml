services:
  db:
    image: postgres:16
    container_name: vizora-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - vizora_pgdata:/var/lib/postgresql/data

volumes:
  vizora_pgdata: